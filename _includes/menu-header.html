<script>
(function() {
    var path = window.location.pathname;
    document.querySelectorAll('.rs-nav-link').forEach(function(link) {
        var href = link.getAttribute('href');
        if (!href) return;
        var cleanHref = href.replace(/^.*\/refersathi\//, '/').replace(/\/$/, '');
        var cleanPath = path.replace(/^\/refersathi\//, '/').replace(/\/$/, '');
        if (cleanHref === cleanPath ||
            (cleanPath === '/' && cleanHref === '/index.html') ||
            (cleanPath === '/index.html' && cleanHref === '/index.html')) {
            link.classList.add('rs-nav-active');
        }
    });
})();
